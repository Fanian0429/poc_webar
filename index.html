<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>POC_WebAR_GeoSLAM</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #ar-overlay-root {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
    }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%;
      box-sizing: border-box; padding: 54px 14px 10px 14px;
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      color: #fff; background: rgba(0,0,0,0.55);
      font-size: 13px; line-height: 1.6;
      pointer-events: none;
    }
    #controls {
      position: fixed; bottom: 0; left: 0; width: 100%;
      box-sizing: border-box; padding: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: auto;
    }
    button {
      font-size: 15px; padding: 12px 22px; border-radius: 8px; border: none;
      background: #2979ff; color: #fff; font-weight: bold;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s ease, transform 0.08s ease, filter 0.08s ease;
    }
    button:disabled { background: #555; }
    #adjust-row, #adjust-row2, #floor-row { display: flex; gap: 8px; }
    #adjust-row button, #adjust-row2 button, #floor-row button { padding: 8px 14px; font-size: 14px; background: #444; }

    /* 模型切換按鈕：淺紫色底、白色外框、白色字，目前作用中的模型改灰底 */
    #model-row { display: flex; gap: 12px; }
    #model-row button {
      width: 46px; height: 46px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 18px;
      background: #b388ff; border: 2px solid #ffffff; color: #ffffff;
    }
    #model-row button.model-btn-active { background: #555555; }
    #model-row button.pressed { filter: brightness(0.85); transform: scale(0.92); }

    #light-row {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      width: 92%; max-width: 420px;
    }
    #light-row label {
      color: #e6d6ff; font-size: 13px; font-weight: bold;
    }
    #light-angle-slider {
      width: 100%; height: 8px; border-radius: 4px; outline: none;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(to right, #4a148c, #b388ff);
    }
    #light-angle-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: #9c27b0; border: 2px solid #f3e5ff;
      cursor: pointer;
    }
    #light-angle-slider::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: #9c27b0; border: 2px solid #f3e5ff;
      cursor: pointer;
    }

    /* 按下時的視覺回饋：灰色按鈕轉藍色、主按鈕變暗，並縮小一點模擬按壓感 */
    #adjust-row button.pressed, #adjust-row2 button.pressed, #floor-row button.pressed {
      background: #2979ff;
      transform: scale(0.94);
    }
    #start-btn.pressed {
      filter: brightness(0.75);
      transform: scale(0.96);
    }

    #status-line { white-space: pre-line; }
  </style>
</head>
<body>

  <div id="ar-overlay-root">
    <div id="overlay">
      <div id="status-line">Not started yet</div>
    </div>

    <div id="controls">
      <div id="model-row">
        <button id="model-btn-1" class="model-btn-active">1</button>
        <button id="model-btn-2">2</button>
      </div>
      <div id="adjust-row" style="display:none;">
        <button id="y-up">Height ▲</button>
        <button id="y-down">Height ▼</button>
        <button id="rot-minus">-5°</button>
        <button id="rot-plus">+5°</button>
      </div>
      <div id="floor-row" style="display:none;">
        <button id="floor-up">Upstairs ▲</button>
        <button id="floor-down">Downstairs ▼</button>
      </div>
      <div id="adjust-row2" style="display:none;">
        <button id="recalibrate-btn">Calibrate by GPS</button>
        <button id="place-here-btn">Place Here</button>
      </div>
      <button id="start-btn">Start AR Experience</button>
      <div id="light-row" style="display:none;">
        <label for="light-angle-slider">Light Angle: <span id="light-angle-value">0</span>°</label>
        <input type="range" id="light-angle-slider" min="0" max="360" step="5" value="0">
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

    // ---------------------------------------------------------------
    // 專案設定：目標建物 GPS 座標與模型資訊
    // ---------------------------------------------------------------
    const TARGET_LAT = 24.183192;
    const TARGET_LON = 120.613790;
    const MODEL_URL = './townhouse.glb';
    const MODEL_URL2 = './Chanley.glb';
    const MODEL_SCALE = 1; // 若模型單位是公尺，先從 1 開始測試，依實際狀況調整

    // 可切換模型清單：key 對應按鈕與 models{} 的存放位置，url/label 用於載入與訊息顯示
    const MODEL_CONFIGS = {
      townhouse: { url: MODEL_URL, label: 'townhouse.glb' },
      chanley:   { url: MODEL_URL2, label: 'Chanley.glb' }
    };

    // 羅盤讀值在不同裝置/瀏覽器上常有系統性偏移(常見 ±15~30°)。
    // 可用「Calibrate by GPS」搭配旋轉/高度按鈕現場修正，
    // 若需要調整羅盤基礎偏移，可直接修改這個常數後重新部署。
    let headingOffset = 0;

    // ---------------------------------------------------------------
    // 狀態變數
    // ---------------------------------------------------------------
    let userLat = null, userLon = null, gpsAccuracy = null;
    let currentHeading = null;
    let model = null;              // 目前作用中(顯示中)的模型物件，永遠指向 models[activeModelKey] 載入完成後的物件
    let modelPlaced = false;
    let activeModelKey = 'townhouse'; // 預設啟用 townhouse，對應按鈕「1」
    const models = {}; // key -> { object3D, fitData }，兩個模型都會各自載入並常駐在場景中，用 visible 切換

    let xrSession = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let previewModeActive = false; // 桌面/不支援 AR 的裝置：改用一般 3D 場景預覽模型，不走 AR 流程

    // 重要：XRFrame 物件只在當次 rAF callback 內有效，不能存起來給按鈕(非同步事件)之後重複使用。
    // 這裡改成只快取「數值/向量」，按鈕只讀這些快取值，不再依賴過期的 frame 物件。
    let lastCameraPosition = null;   // { x, y, z }
    let lastCameraForward = null;    // THREE.Vector3 (水平面上的朝向)
    let lastHitPosition = null;      // { x, y, z } 最近一次偵測到的平面位置
    let planeEverDetected = false;   // 用來只觸發一次「Plane detected successfully」訊息

    // 畫面最下面一行的訊息，預設不會被 GPS/羅盤的數值更新覆蓋掉，
    // 只有明確呼叫 updateStatus(newMessage) 時才會更新，確保訊息不會瞬間被洗掉
    let lastMessage = 'Not started yet';

    const statusEl = document.getElementById('status-line');
    const startBtn = document.getElementById('start-btn');
    const adjustRow = document.getElementById('adjust-row');
    const adjustRow2 = document.getElementById('adjust-row2');
    const floorRow = document.getElementById('floor-row');
    const lightRow = document.getElementById('light-row');
    const lightAngleSlider = document.getElementById('light-angle-slider');
    const lightAngleValue = document.getElementById('light-angle-value');
    const modelBtn1 = document.getElementById('model-btn-1'); // townhouse.glb
    const modelBtn2 = document.getElementById('model-btn-2'); // Chanley.glb
    lightAngleSlider.addEventListener('input', () => {
      lightAngleDeg = Number(lightAngleSlider.value);
      lightAngleValue.textContent = lightAngleDeg;
    });

    function updateStatus(newMessage) {
      if (newMessage !== undefined) {
        lastMessage = newMessage;
      }
      const dist = (userLat !== null) ? haversineDistance(userLat, userLon, TARGET_LAT, TARGET_LON).toFixed(1) + ' m' : '-';
      const brng = (userLat !== null) ? bearing(userLat, userLon, TARGET_LAT, TARGET_LON).toFixed(0) + '°' : '-';
      statusEl.textContent =
        `GPS: ${userLat ? userLat.toFixed(6) : '-'}, ${userLon ? userLon.toFixed(6) : '-'} (accuracy ${gpsAccuracy ? gpsAccuracy.toFixed(0)+'m' : '-'})\n` +
        `Target distance: ${dist}   Bearing: ${brng}\n` +
        `Compass heading: ${currentHeading !== null ? currentHeading.toFixed(0)+'°' : '-'}   Offset: ${headingOffset}°\n` +
        lastMessage;
    }

    // ---------------------------------------------------------------
    // 地理計算：距離(Haversine)與方位角(Bearing)
    // ---------------------------------------------------------------
    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function bearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
      const brng = toDeg(Math.atan2(y, x));
      return (brng + 360) % 360; // 0-360, 0=正北, 順時鐘
    }

    // ---------------------------------------------------------------
    // GPS：持續追蹤使用者位置
    // ---------------------------------------------------------------
    function startGeolocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation not supported by this browser'));
          return;
        }
        navigator.geolocation.watchPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            gpsAccuracy = pos.coords.accuracy;
            updateStatus(); // 不帶參數 = 只刷新數值列，不會動到最後一行的訊息
            resolve();
          },
          (err) => {
            console.error('Geolocation error', err);
            reject(err);
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      });
    }

    // ---------------------------------------------------------------
    // 羅盤：取得裝置目前朝向真北的夾角(Android Chrome: deviceorientationabsolute)
    // ---------------------------------------------------------------
    function startCompass() {
      window.addEventListener('deviceorientationabsolute', (event) => {
        if (event.alpha === null) return;
        // 注意：alpha 的方向定義在不同裝置上可能相反，
        // 如發現模型方向錯誤，可用「-5°/+5°」旋轉按鈕現場校正
        currentHeading = (event.alpha + headingOffset + 360) % 360;
        updateStatus();
      }, true);
    }

    // ---------------------------------------------------------------
    // 按鈕按壓視覺回饋：pointerdown 轉換樣式、pointerup/leave/cancel 還原
    // ---------------------------------------------------------------
    function addPressEffect(btn) {
      const press = () => btn.classList.add('pressed');
      const release = () => btn.classList.remove('pressed');
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
    }
    document.querySelectorAll('#controls button').forEach(addPressEffect);

    document.getElementById('y-up').addEventListener('click', () => {
      if (!model) return;
      model.position.y += 0.1;
      updateStatus('Height raised by 0.1m (current Y: ' + model.position.y.toFixed(2) + ')');
    });
    document.getElementById('y-down').addEventListener('click', () => {
      if (!model) return;
      model.position.y -= 0.1;
      updateStatus('Height lowered by 0.1m (current Y: ' + model.position.y.toFixed(2) + ')');
    });
    document.getElementById('rot-plus').addEventListener('click', () => {
      if (!model) return;
      model.rotation.y += toRad(5);
      updateStatus('Rotated +5° (clockwise)');
    });
    document.getElementById('rot-minus').addEventListener('click', () => {
      if (!model) return;
      model.rotation.y -= toRad(5);
      updateStatus('Rotated -5° (counter-clockwise)');
    });
    document.getElementById('floor-up').addEventListener('click', () => {
      if (!model) return;
      model.position.y -= 3;
      updateStatus('Moved up one floor (+3m, current Y: ' + model.position.y.toFixed(2) + ')');
    });
    document.getElementById('floor-down').addEventListener('click', () => {
      if (!model) return;
      model.position.y += 3;
      updateStatus('Moved down one floor (-3m, current Y: ' + model.position.y.toFixed(2) + ')');
    });
    document.getElementById('recalibrate-btn').addEventListener('click', () => {
      if (lastHitPosition && lastCameraPosition && lastCameraForward) {
        placeModelFromCache();
      } else {
        updateStatus('No plane detected yet. Cannot calibrate.');
      }
    });
    document.getElementById('place-here-btn').addEventListener('click', () => {
      if (!lastHitPosition || !lastCameraPosition) { updateStatus('No plane detected yet. Cannot place model.'); return; }
      if (!model) { updateStatus('Model is not loaded yet.'); return; }

      model.position.set(lastHitPosition.x, lastHitPosition.y, lastHitPosition.z);
      model.rotation.y = Math.atan2(
        lastCameraPosition.x - lastHitPosition.x,
        lastCameraPosition.z - lastHitPosition.z
      );
      model.visible = true;
      modelPlaced = true;
      updateStatus('GPS ignored. Model placed at the currently detected surface.');
    });

    // ---------------------------------------------------------------
    // Three.js 基本場景與燈光
    // 需求：不再追蹤太陽方向，改用固定的均勻光照，盡量降低模型的明暗反差
    // ---------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

    // 環境光(Hemisphere)，均勻沒有方向性陰影，作為基礎照明
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.9);
    scene.add(hemiLight);

    // 單一方向光，角度可用畫面下方的滑桿(或 +5°/-5° 按鈕)即時旋轉調整
    // 這個距離會在模型載入完成後，依實際包圍球大小重新計算(見 computeFitData/applyFitData)，這裡只是模型載入前的暫時預設值
    let MAIN_LIGHT_DISTANCE = 5;
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
    scene.add(mainLight);
    scene.add(mainLight.target); // DirectionalLight 的 target 必須加入場景，調整 target.position 才會生效

    // ---------------------------------------------------------------
    // 雙模式光照設定：
    // AR 模式：開啟陰影渲染，環境光適度降低讓陰影看得出來，同時保留一定亮度維持戶外可讀性
    // Preview 模式：更強的方向光對比 + 陰影，模擬光線穿過窗戶被牆面遮擋的效果，適合室內精緻展示
    // ---------------------------------------------------------------
    // 陰影柔邊演算法選擇：預設用 PCFSoftShadowMap(相容性/效能最穩妥)。
    // 若想要更明顯的模糊柔邊，可以把這個改成 true 試試 VSMShadowMap，
    // 但要留意可能增加 GPU 負擔、且邊緣可能出現輕微漏光瑕疵，建議實機比較後再決定要不要保留。
    const USE_VSM_SHADOWS = false;

    const LIGHTING_PROFILES = {
      ar: { mainIntensity: 1.2, hemiIntensity: 0.6, shadows: true },
      preview: { mainIntensity: 1.6, hemiIntensity: 0.35, shadows: true }
    };

    let currentProfileName = 'ar'; // 記錄目前套用的是哪一組光照 profile，切換模型時才知道「預設值」該回到多少
    const CHANLEY_HEMI_BOOST = 2; // 切到 Chanley.glb 時，環境光(HemisphereLight)要提升到的強度

    // 環境光(HemisphereLight)強度的單一決策點：預設沿用目前光照 profile 的基礎值，
    // 但只要「目前作用中的模型」是 Chanley.glb，就改用加強值；切回 townhouse 就自動還原成 profile 預設值。
    // 統一寫在這裡呼叫，而不是在各處分別設定 hemiLight.intensity，避免之後不同地方各自寫死數字互相打架。
    function updateHemiLightForActiveModel() {
      hemiLight.intensity = (activeModelKey === 'chanley')
        ? CHANLEY_HEMI_BOOST
        : LIGHTING_PROFILES[currentProfileName].hemiIntensity;
    }

    function applyLightingProfile(profileName) {
      currentProfileName = profileName;
      const profile = LIGHTING_PROFILES[profileName];
      mainLight.intensity = profile.mainIntensity;
      mainLight.castShadow = profile.shadows;
      renderer.shadowMap.enabled = profile.shadows;
      // PCFSoftShadowMap 本身就會套用柔化過的邊緣濾波，是目前預設、相容性/效能最穩妥的選項。
      // 如果實測後還想要更明顯的模糊柔邊，可以把下面 USE_VSM_SHADOWS 打開試試看，
      // 但 VSM 對手機 GPU 負擔更重，且可能出現「漏光(light bleeding)」的邊緣瑕疵，記得實機比較兩者再決定。
      if (USE_VSM_SHADOWS) {
        renderer.shadowMap.type = THREE.VSMShadowMap;
        mainLight.shadow.radius = 4;
        mainLight.shadow.blurSamples = 16;
      } else {
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      previewGround.visible = profile.shadows;
      updateHemiLightForActiveModel(); // profile 切換(AR/Preview)時，環境光也要重新依目前模型決定要不要套加強值
    }

    // 陰影攝影機範圍會在模型載入完成後依實際大小動態計算(見 computeFitData/applyFitData)，
    // 這裡先給一組載入前的預設值，避免 model 尚未存在時報錯
    const SHADOW_MAP_SIZE = 3072; // 從 2048 提高，陰影邊緣鋸齒主要就是解析度不夠細緻造成的
    mainLight.shadow.mapSize.set(SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
    mainLight.shadow.camera.left = -10;
    mainLight.shadow.camera.right = 10;
    mainLight.shadow.camera.top = 10;
    mainLight.shadow.camera.bottom = -10;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 50;
    mainLight.shadow.bias = -0.0005;
    mainLight.shadow.normalBias = 0.02; // 用法線方向偏移取代單純深度偏移，減少邊緣鋸齒/暗紋而不會整體變模糊
    mainLight.shadow.camera.updateProjectionMatrix();

    // ---------------------------------------------------------------
    // 依模型實際包圍球(bounding sphere)大小，動態計算光源距離與陰影攝影機視錐範圍。
    // 修正原因：原本用固定數字(距離5、視錐±10)是用小型模型的假設寫死的，
    // 如果實際模型(例如三層樓建物)比這個範圍大，陰影攝影機會框不住整棟建物，
    // 導致部分結構(如上層樓板)沒有被算進陰影運算，造成光線不合理地穿透、
    // 或轉到某些角度時牆面/窗框失去遮擋效果。這裡改成量測模型實際大小後自動抓一個足夠寬鬆的範圍。
    //
    // 視錐範圍(frustumSize)的倍率也直接影響陰影銳利度：同樣 SHADOW_MAP_SIZE 的解析度，
    // 攤在越大的範圍上，每一顆陰影貼圖像素對應到的實際公尺數就越粗、邊緣就越鋸齒。
    // 這裡把倍率收緊到 1.15(比原本寬鬆的 1.6 更銳利，但比上一輪的 1.05 多留一點安全邊際，
    // 避免浮點誤差或模型邊緣頂點剛好卡在邊界上被裁到)。
    //
    // 真正修掉「範圍是否對準模型」這個問題的關鍵，是下面的 modelCenterLocalOffset：
    // 不能直接把陰影攝影機瞄準 model.position(模型的 pivot 原點)，因為 Rhino/CAD 匯出的模型，
    // pivot 常常不在幾何中心(可能在角落或底部基準點)。上一輪把範圍收得太緊時，
    // 這個「瞄準點跟真實中心對不齊」的誤差就會讓建物邊緣落到視錐外，导致遮擋失效。
    // 修法：記錄真正幾何中心相對於 pivot 的本地座標偏移，之後不管模型怎麼平移/旋轉，
    // 都用這個偏移換算出目前的真實世界座標中心，而不是永遠瞄準 pivot。
    // ---------------------------------------------------------------
    const modelCenterLocalOffset = new THREE.Vector3(0, 0, 0);
    // 地面陰影承接面要對齊模型「底部」(bounding box 最低點，理論上就是一樓地板)，
    // 這跟光源瞄準用的「幾何中心」是不同的參考點，不能共用同一個變數，
    // 否則地面會被抬到建物半高處，陰影就會浮在半空中(圖3的錯誤)。
    const modelBaseLocalPoint = new THREE.Vector3(0, 0, 0);

    // 純計算：量測模型包圍球，回傳這顆模型專屬的陰影/光源參數，不直接修改任何全域狀態。
    // 因為現在有兩個模型可以切換，且各自大小、pivot 位置都不同，每個模型都要保留自己的一份計算結果，
    // 等它變成「目前作用中的模型」時才套用到 mainLight/shadow camera 上(見 applyFitData)。
    function computeFitData(root) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const radius = Math.max(sphere.radius, 1); // 至少給 1，避免極端情況下 radius 算出 0

      const worldToLocal = new THREE.Matrix4().copy(root.matrixWorld).invert();
      const centerLocalOffset = sphere.center.clone().applyMatrix4(worldToLocal);
      const baseLocalOffset = new THREE.Vector3(sphere.center.x, box.min.y, sphere.center.z).applyMatrix4(worldToLocal);

      const mainLightDistance = radius * 3; // 光源明顯拉遠到包圍球半徑的 3 倍，確保不會落在建物幾何範圍內部
      const frustumSize = radius * 1.15;

      return {
        centerLocalOffset,
        baseLocalOffset,
        mainLightDistance,
        frustumSize,
        // near 只要涵蓋建物本身即可(建物離光源的距離範圍)，維持原本算法；
        // far 則要放寬更多——陰影不是只投影在建物基座旁邊，樓層越高、光線角度越低，
        // 陰影會落在離建物更遠的地面上，如果 far 只夠框住建物本身，這些「落在較遠地面」的陰影範圍會被裁掉，
        // 導致只有一樓附近的陰影正常、上面樓層的陰影在地面上消失。這裡把倍率大幅放寬，確保涵蓋足夠遠的落地範圍。
        near: Math.max(0.1, mainLightDistance - radius * 2),
        far: mainLightDistance + radius * 8
      };
    }

    // 把某個模型的 fitData 套用到目前的 mainLight / shadow camera 上，並更新光源位置。
    // 切換作用中模型時只要呼叫這個函式，陰影範圍就會即時對應到新模型的大小。
    function applyFitData(fitData) {
      modelCenterLocalOffset.copy(fitData.centerLocalOffset);
      modelBaseLocalPoint.copy(fitData.baseLocalOffset);
      MAIN_LIGHT_DISTANCE = fitData.mainLightDistance;

      mainLight.shadow.camera.left = -fitData.frustumSize;
      mainLight.shadow.camera.right = fitData.frustumSize;
      mainLight.shadow.camera.top = fitData.frustumSize;
      mainLight.shadow.camera.bottom = -fitData.frustumSize;
      mainLight.shadow.camera.near = fitData.near;
      mainLight.shadow.camera.far = fitData.far;
      mainLight.shadow.camera.updateProjectionMatrix();

      updateMainLightPosition();
    }

    // 依 modelCenterLocalOffset 換算出模型目前(平移/旋轉後)的真實世界座標幾何中心(給光源瞄準用)
    function getModelWorldCenter() {
      if (!model) return null;
      model.updateMatrixWorld(true);
      return modelCenterLocalOffset.clone().applyMatrix4(model.matrixWorld);
    }

    // 依 modelBaseLocalPoint 換算出模型目前的真實世界座標「底部」(給地面陰影承接面用)
    function getModelWorldBase() {
      if (!model) return null;
      model.updateMatrixWorld(true);
      return modelBaseLocalPoint.clone().applyMatrix4(model.matrixWorld);
    }

    // 只在 Preview 模式顯示的地面(ShadowMaterial 只會渲染陰影本身，其餘部分完全透明，
    // 不會在 AR 模式下多一塊奇怪的灰色地板)
    const previewGround = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    previewGround.rotation.x = -Math.PI / 2;
    previewGround.receiveShadow = true;
    previewGround.visible = false;
    scene.add(previewGround);

    // 讓模型的每個 mesh 都能投射/接收陰影(只有在 Preview 模式、mainLight.castShadow=true 時才會真正計算)
    function enableShadowsOnModel(root) {
      root.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
    }

    let lightAngleDeg = 0; // 0~360，水平面上的旋轉角度(繞 Y 軸)

    // 依目前 lightAngleDeg 重新計算光源在水平面上的位置(高度固定，只旋轉水平方向)
    function updateMainLightPosition() {
      const rad = toRad(lightAngleDeg);
      const dx = Math.sin(rad) * MAIN_LIGHT_DISTANCE;
      const dz = Math.cos(rad) * MAIN_LIGHT_DISTANCE;
      if (model) {
        const center = getModelWorldCenter();
        const base = getModelWorldBase();
        mainLight.position.set(center.x + dx, center.y + MAIN_LIGHT_DISTANCE * 0.8, center.z + dz);
        mainLight.target.position.copy(center);
        previewGround.position.set(base.x, base.y - 0.01, base.z);
      } else {
        mainLight.position.set(dx, MAIN_LIGHT_DISTANCE * 0.8, dz);
      }
    }
    applyLightingProfile('ar'); // 預設先套用 AR 模式的均勻光照，避免尚未進入任何模式前就啟用陰影運算
    updateMainLightPosition();

    // 若實測後模型仍然有不想要的明暗差異，可以把這個開關打開，
    // 模型會改用不受光照影響的原始顏色顯示，保證絕對均勻
    const USE_FLAT_SHADING_FALLBACK = false;

    function applyFlatShadingFallback(root) {
      root.traverse((node) => {
        if (node.isMesh && node.material) {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          const flatMats = materials.map((mat) => new THREE.MeshBasicMaterial({
            map: mat.map || null,
            color: mat.color ? mat.color.clone() : 0xffffff
          }));
          node.material = Array.isArray(node.material) ? flatMats : flatMats[0];
        }
      });
    }

    // ---------------------------------------------------------------
    // 邊緣線顯示：模擬 Rhino「彩現 + 顯示邊緣」模式，統一黑色線
    // 用 Three.js 內建的 EdgesGeometry 在執行期即時計算，不需要修改模型檔案本身
    // ---------------------------------------------------------------
    const SHOW_EDGES = true;
    const EDGE_COLOR = 0x000000;
    const EDGE_ANGLE_THRESHOLD = 30; // 相鄰面法線夾角超過幾度才畫線，數字越小線越多、越細碎

    function addEdgeOutlines(root) {
      const edgeMaterial = new THREE.LineBasicMaterial({ color: EDGE_COLOR });
      root.traverse((node) => {
        if (node.isMesh && node.geometry) {
          const edgesGeo = new THREE.EdgesGeometry(node.geometry, EDGE_ANGLE_THRESHOLD);
          const edgeLines = new THREE.LineSegments(edgesGeo, edgeMaterial);
          // 掛在 mesh 底下當子物件，這樣模型之後的 scale/position/rotation 調整會一併帶著邊緣線走
          node.add(edgeLines);
        }
      });
    }

    // ---------------------------------------------------------------
    // 強制雙面渲染功能：關閉。雙面材質改由模型匯出時直接設定，不在程式碼端處理。
    // 如果之後又需要在程式碼端強制雙面顯示，把下面這個常數改回 true 即可，
    // 邏輯還在，只是預設不啟用。
    // ---------------------------------------------------------------
    const FORCE_DOUBLE_SIDED = false;

    function forceDoubleSidedMaterials(root) {
      root.traverse((node) => {
        if (node.isMesh && node.material) {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach((mat) => {
            mat.side = THREE.DoubleSide;
          });
        }
      });
    }

    const loader = new GLTFLoader();

    // 依 key(對應 MODEL_CONFIGS) 載入單一模型，處理完邊緣線/陰影/雙面設定後存進 models[key]。
    // 兩個模型都會被載入並常駐在場景中(用 visible 切換顯示)，只有目前作用中的那個才會套用到
    // 場景顯示狀態與光源/陰影參數上，避免背景載入完的另一個模型突然蓋過畫面。
    function loadModel(key) {
      const config = MODEL_CONFIGS[key];
      loader.load(
        config.url,
        (gltf) => {
          const root = gltf.scene;
          root.scale.set(MODEL_SCALE, MODEL_SCALE, MODEL_SCALE);
          root.visible = false;
          if (USE_FLAT_SHADING_FALLBACK) {
            applyFlatShadingFallback(root);
          }
          if (FORCE_DOUBLE_SIDED) {
            forceDoubleSidedMaterials(root);
          }
          if (SHOW_EDGES) {
            addEdgeOutlines(root);
          }
          enableShadowsOnModel(root);
          scene.add(root);

          models[key] = { object3D: root, fitData: computeFitData(root) };

          if (key === activeModelKey) {
            // 目前預設/使用者已選擇的模型剛好載入完成：直接接手成為顯示中的模型
            model = root;
            applyFitData(models[key].fitData);
            if (previewModeActive) {
              model.visible = true; // 預覽模式沒有 GPS/hit-test 流程，模型載入完就直接顯示
            }
            updateStatus(config.label + ' loaded. Waiting for AR plane detection.');
          } else {
            updateStatus(config.label + ' loaded in the background.');
          }
        },
        undefined,
        (err) => {
          console.error('GLTF load error', err);
          updateStatus('Failed to load ' + config.label + '. Please check the file path.');
        }
      );
    }

    // 切換到 key 對應的模型：把目前模型的位置/旋轉/顯示狀態複製過去，讓使用者感覺
    // 是「同一個已放置好的座標換了一個模型外觀」，不需要重新走一次 GPS/hit-test 流程。
    function switchToModel(key) {
      if (key === activeModelKey) return;

      const entry = models[key];
      if (!entry) {
        updateStatus(MODEL_CONFIGS[key].label + ' is still loading, please wait...');
        return;
      }

      const oldModel = model;
      const newModel = entry.object3D;

      if (oldModel) {
        newModel.position.copy(oldModel.position);
        newModel.rotation.copy(oldModel.rotation);
        newModel.visible = oldModel.visible;
        oldModel.visible = false;
      } else if (previewModeActive) {
        // 極少數情況：預設模型都還沒載完，使用者就先切到另一個模型
        newModel.position.set(0, 0, 0);
        newModel.visible = true;
      }

      model = newModel;
      activeModelKey = key;
      applyFitData(entry.fitData);
      updateHemiLightForActiveModel(); // 切到 Chanley 加強環境光，切回 townhouse 還原 profile 預設值
      updateModelButtonsUI();
      updateStatus('Switched to ' + MODEL_CONFIGS[key].label + '.');
    }

    // 按鈕視覺狀態：目前作用中的模型改灰底(model-btn-active)，另一顆維持淺紫色
    function updateModelButtonsUI() {
      modelBtn1.classList.toggle('model-btn-active', activeModelKey === 'townhouse');
      modelBtn2.classList.toggle('model-btn-active', activeModelKey === 'chanley');
    }

    modelBtn1.addEventListener('click', () => switchToModel('townhouse'));
    modelBtn2.addEventListener('click', () => switchToModel('chanley'));

    loadModel('townhouse');
    loadModel('chanley');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------------------------------------------------------------
    // 啟動流程：權限確認 -> WebXR session -> hit-test -> 放置模型
    // ---------------------------------------------------------------
    startBtn.addEventListener('click', onStart);

    async function onStart() {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting...';

      if (!navigator.xr) {
        updateStatus('WebXR not supported by this browser. Switching to desktop preview mode (drag to orbit, scroll to zoom, WASD+QE to fly, hold Shift to move faster).');
        startPreviewMode();
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        updateStatus('immersive-ar not supported on this device/browser. Switching to desktop preview mode (drag to orbit, scroll to zoom, WASD+QE to fly, hold Shift to move faster).');
        startPreviewMode();
        return;
      }

      try {
        updateStatus('Requesting GPS permission...');
        await startGeolocation();
        startCompass();
      } catch (e) {
        updateStatus('Failed to get GPS permission. The model can still be shown, but not positioned by GPS.');
      }

      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.getElementById('ar-overlay-root') }
        });

        xrSession = session;
        session.addEventListener('end', onSessionEnd);

        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);
        applyLightingProfile('ar');

        startBtn.style.display = 'none';
        adjustRow.style.display = 'flex';
        floorRow.style.display = 'flex';
        adjustRow2.style.display = 'flex';
        lightRow.style.display = 'flex';

        renderer.setAnimationLoop(onXRFrame);
      } catch (e) {
        console.error(e);
        updateStatus('Failed to start WebXR session: ' + e.message);
        startBtn.disabled = false;
        startBtn.textContent = 'Start AR Experience';
      }
    }

    function onSessionEnd() {
      xrSession = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      modelPlaced = false;
      planeEverDetected = false;
      if (model) model.visible = false;
      startBtn.style.display = 'block';
      startBtn.disabled = false;
      startBtn.textContent = 'Start AR Experience';
      adjustRow.style.display = 'none';
      floorRow.style.display = 'none';
      adjustRow2.style.display = 'none';
      lightRow.style.display = 'none';
      renderer.setAnimationLoop(null);
    }

    // ---------------------------------------------------------------
    // 桌面預覽模式：WASD + Q/E 自由飛行移動(概念類似 Blender 的 Shift+`飛行導覽)
    // 滑鼠 drag 依然透過 OrbitControls 旋轉視角，這裡另外用鍵盤把「攝影機位置」與
    // 「OrbitControls 的軌道中心(target)」同步平移，等於整個人一起飛過去，
    // 而不是繞著原地不動的舊中心打轉，藉此突破滾輪 dolly 的距離限制，可自由飛到建物任何角落。
    // ---------------------------------------------------------------
    const flyKeysPressed = {};
    const FLY_BASE_SPEED = 2.5;     // 基礎移動速度(公尺/秒)
    const FLY_BOOST_MULTIPLIER = 3; // 按住 Shift 加速飛行
    const flyClock = new THREE.Clock();

    window.addEventListener('keydown', (e) => {
      flyKeysPressed[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      flyKeysPressed[e.code] = false;
    });
    // 分頁切到背景/視窗失焦時，把殘留的按鍵狀態全部清掉，
    // 避免使用者切走視窗時剛好按著 W，回來後攝影機還在暗自持續往前飛
    window.addEventListener('blur', () => {
      Object.keys(flyKeysPressed).forEach((k) => { flyKeysPressed[k] = false; });
    });

    function updateFlyMovement() {
      if (!previewModeActive || !previewControls) return;

      const dt = flyClock.getDelta();

      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward); // 攝影機目前實際看向的方向(含俯仰角度)，達到真正的自由飛行(不只是水平走動)
      const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
      const up = new THREE.Vector3(0, 1, 0); // Q/E 固定沿世界垂直軸移動，方便維持樓層高度感，不受目前視角俯仰影響

      const moveDir = new THREE.Vector3();
      if (flyKeysPressed['KeyW']) moveDir.add(forward);
      if (flyKeysPressed['KeyS']) moveDir.sub(forward);
      if (flyKeysPressed['KeyD']) moveDir.add(right);
      if (flyKeysPressed['KeyA']) moveDir.sub(right);
      if (flyKeysPressed['KeyE']) moveDir.add(up);
      if (flyKeysPressed['KeyQ']) moveDir.sub(up);

      if (moveDir.lengthSq() === 0) return;

      moveDir.normalize();
      const boost = (flyKeysPressed['ShiftLeft'] || flyKeysPressed['ShiftRight']) ? FLY_BOOST_MULTIPLIER : 1;
      moveDir.multiplyScalar(FLY_BASE_SPEED * boost * dt);

      // 攝影機與軌道中心一起平移：OrbitControls.update() 每一幀都會用「目前攝影機位置 - target」
      // 重新算出球座標，只要兩者位移量相同，旋轉/縮放的相對關係就完全不受影響，
      // 滑鼠拖曳依然能以移動後的新位置為中心自然旋轉。
      camera.position.add(moveDir);
      previewControls.target.add(moveDir);
    }

    // ---------------------------------------------------------------
    // 桌面預覽模式：滑鼠左鍵「原地環顧」(look-around)，跟右鍵的 OrbitControls 旋轉不同——
    // 右鍵旋轉是攝影機繞著 target「移動位置」；左鍵這裡改成只轉動攝影機朝向，
    // 攝影機位置完全不動，概念上更接近 FPS/遊戲引擎的滑鼠視角控制，方便搭配 WASD+QE 飛行使用。
    //
    // 做法：左鍵拖曳時直接用 yaw(繞世界 Y 軸)/pitch(繞攝影機本地 X 軸)的 Euler 角度
    // (順序 'YXZ'，不會有 roll)去設定 camera.quaternion；每次更新完，再把 OrbitControls 的
    // target 重新擺到「攝影機新朝向的正前方、原本的距離處」——這樣下次改用右鍵環繞旋轉
    // 或滾輪縮放時，OrbitControls 才不會因為 target 沒跟著轉而發生鏡頭瞬間跳走的狀況。
    // ---------------------------------------------------------------
    const LOOK_SENSITIVITY = 0.0025;             // 每 1px 滑鼠位移對應的旋轉弧度，數字越大手感越靈敏
    const LOOK_PITCH_LIMIT = Math.PI / 2 - 0.01; // 上下俯仰角限制在接近 ±90°，避免整個人翻過去

    let lookDragActive = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    const lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    function onLookPointerDown(event) {
      if (!previewModeActive || event.button !== 0) return;
      lookDragActive = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      // 從目前攝影機的實際朝向反推 yaw/pitch，讓這次拖曳從目前視角銜接，不會瞬間跳掉
      lookEuler.setFromQuaternion(camera.quaternion, 'YXZ');
    }

    function onLookPointerMove(event) {
      if (!lookDragActive) return;
      const dx = event.clientX - lastPointerX;
      const dy = event.clientY - lastPointerY;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      lookEuler.y -= dx * LOOK_SENSITIVITY;
      lookEuler.x -= dy * LOOK_SENSITIVITY;
      lookEuler.x = Math.max(-LOOK_PITCH_LIMIT, Math.min(LOOK_PITCH_LIMIT, lookEuler.x));
      camera.quaternion.setFromEuler(lookEuler);

      if (previewControls) {
        const distanceToTarget = camera.position.distanceTo(previewControls.target);
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        previewControls.target.copy(camera.position).addScaledVector(forward, distanceToTarget);
      }
    }

    function onLookPointerUp(event) {
      if (event.button !== 0) return;
      lookDragActive = false;
    }

    renderer.domElement.addEventListener('pointerdown', onLookPointerDown);
    renderer.domElement.addEventListener('pointermove', onLookPointerMove);
    window.addEventListener('pointerup', onLookPointerUp);
    // 視窗失焦時(例如切分頁時剛好按著左鍵)也要清掉拖曳狀態，避免回來後角度突然亂跳
    window.addEventListener('blur', () => { lookDragActive = false; });

    // ---------------------------------------------------------------
    // 桌面預覽模式：裝置/瀏覽器不支援 immersive-ar 時的退路，
    // 跳過 GPS/羅盤/hit-test，直接用一般 Three.js 場景 + 滑鼠軌道控制顯示模型，
    // 方便在筆電上檢查模型外觀(邊緣線、光照、材質)，不需要手機也不需要部署到 GitHub Pages。
    // ---------------------------------------------------------------
    let previewControls = null;

    function startPreviewMode() {
      previewModeActive = true;
      applyLightingProfile('preview');
      startBtn.style.display = 'none';
      adjustRow.style.display = 'flex';   // 高度/旋轉按鈕在預覽模式一樣可以用，方便檢查模型各角度
      floorRow.style.display = 'flex';
      lightRow.style.display = 'flex';    // 光線角度滑桿在預覽模式也能用，方便檢查光照效果
      // GPS 校準/放置按鈕在預覽模式沒有意義(沒有真實定位)，維持隱藏
      adjustRow2.style.display = 'none';

      scene.background = new THREE.Color(0xdddddd); // 給一個中性背景色方便看清楚模型輪廓與邊緣線

      camera.position.set(4, 3, 6);
      camera.lookAt(0, 1, 0);

      previewControls = new OrbitControls(camera, renderer.domElement);
      previewControls.target.set(0, 1, 0);
      previewControls.enableDamping = false;
      // 左鍵這裡改成 null，停用 OrbitControls 內建對左鍵的處理，改由上面自訂的
      // 「原地環顧」(look-around)邏輯接管——左鍵拖曳只轉動攝影機朝向，攝影機位置不會移動。
      // 右鍵改成 ROTATE，變成環繞旋轉(攝影機繞著 target 移動位置)，Shift+右鍵則會是平移(PAN)，
      // 這是 OrbitControls 內建的修飾鍵邏輯，只要哪個按鍵設成 ROTATE，Shift+那個按鍵就會自動變成 PAN。
      previewControls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
      };
      previewControls.update();

      if (model) {
        model.visible = true;
        model.position.set(0, 0, 0);
      }

      renderer.setAnimationLoop(() => {
        updateFlyMovement();
        previewControls.update();
        updateMainLightPosition();
        renderer.render(scene, camera);
      });
    }

    async function initHitTestSource() {
      const viewerSpace = await xrSession.requestReferenceSpace('viewer');
      hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
    }

    function onXRFrame(timestamp, frame) {
      if (!hitTestSourceRequested) {
        hitTestSourceRequested = true;
        initHitTestSource();
      }

      const referenceSpace = renderer.xr.getReferenceSpace();
      const camPose = frame.getViewerPose(referenceSpace);

      // 每一幀把相機位置/朝向存成一般數值與向量，供按鈕之後(非同步)安全使用
      if (camPose) {
        const camPos = camPose.transform.position;
        const camOri = camPose.transform.orientation;
        lastCameraPosition = { x: camPos.x, y: camPos.y, z: camPos.z };

        const camQuat = new THREE.Quaternion(camOri.x, camOri.y, camOri.z, camOri.w);
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
        fwd.y = 0;
        fwd.normalize();
        lastCameraForward = fwd;
      }

      if (hitTestSource) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          const hp = pose.transform.position;
          lastHitPosition = { x: hp.x, y: hp.y, z: hp.z };

          if (!modelPlaced) {
            planeEverDetected = true;
            placeModelFromCache('Plane detected successfully. Model anchored — stability now relies entirely on device SLAM tracking.');
          }
        } else if (!modelPlaced) {
          updateStatus('Point your phone at the floor/table to scan for a surface...');
        }
      }

      updateMainLightPosition();
      renderer.render(scene, camera);
    }

    // ---------------------------------------------------------------
    // 核心邏輯：依 GPS 距離/方位角 + 羅盤朝向，計算模型在 XR 世界座標中的位置
    // 只使用快取的數值/向量，不依賴任何 XRFrame 物件，按鈕可安全重複呼叫
    // ---------------------------------------------------------------
    function placeModelFromCache(successMessage) {
      if (!model) { updateStatus('Model is still loading...'); return; }
      if (userLat === null || userLon === null) { updateStatus('Waiting for GPS...'); return; }
      if (currentHeading === null) { updateStatus('Waiting for compass data...'); return; }
      if (!lastCameraPosition || !lastCameraForward || !lastHitPosition) { updateStatus('Waiting for plane detection...'); return; }

      const distance = haversineDistance(userLat, userLon, TARGET_LAT, TARGET_LON);
      const targetBearing = bearing(userLat, userLon, TARGET_LAT, TARGET_LON);

      const relativeAngle = toRad(targetBearing - currentHeading);
      const targetDir = lastCameraForward.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -relativeAngle);

      model.position.set(
        lastCameraPosition.x + targetDir.x * distance,
        lastHitPosition.y, // 高度使用 hit-test 偵測到的平面 Y 座標
        lastCameraPosition.z + targetDir.z * distance
      );
      model.rotation.y = Math.atan2(targetDir.x, targetDir.z);

      model.visible = true;
      modelPlaced = true;
      updateStatus(successMessage || 'Model anchored — stability now relies entirely on device SLAM tracking.');
    }
  </script>
</body>
</html>
